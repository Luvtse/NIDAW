# ============================================================================
# NIDAW Helm Chart - Production Values
# ============================================================================

# Global settings
global:
  environment: production
  region: us-east-1
  domain: nidaw.com
  
  imagePullSecrets: []
  
  commonLabels:
    app.kubernetes.io/part-of: nidaw-platform
    environment: production
  
  commonAnnotations:
    prometheus.io/scrape: "true"

# ============================================================================
# Backend Configuration
# ============================================================================

backend:
  enabled: true
  
  replicaCount: 5
  
  image:
    repository: nidaw/backend
    tag: v1.0.0
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
    metricsPort: 9090
  
  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
    limits:
      cpu: 2000m
      # Keep the limit above the 2Gi request; Kubernetes rejects request > limit.
      memory: 3Gi
  
  autoscaling:
    enabled: true
    minReplicas: 5
    maxReplicas: 20
    targetCPUUtilizationPercentage: 60
    targetMemoryUtilizationPercentage: 70
  
  env:
    ENVIRONMENT: production
    LOG_LEVEL: warn
    LOG_FORMAT: json
    ENABLE_PROFILING: "false"
  
  secrets:
    existingSecret: nidaw-backend-secrets
  
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
  
  readinessProbe:
    httpGet:
      path: /ready
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5

# ============================================================================
# Frontend Configuration
# ============================================================================

frontend:
  enabled: true
  
  replicaCount: 5
  
  image:
    repository: nidaw/frontend
    tag: v1.0.0
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  
  autoscaling:
    enabled: false
  
  # Flutter web API URLs are compiled into the image via --dart-define.
  # These values document the expected release contract; changing them in Helm alone is not sufficient.
  env:
    API_BASE_URL: https://api.nidaw.com
    WS_BASE_URL: wss://api.nidaw.com/ws
    ENVIRONMENT: production
    ENABLE_DEBUG: "false"
    LOG_LEVEL: warn
  
  configMap:
    enabled: true
  
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
  
  readinessProbe:
    httpGet:
      path: /ready
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5

# ============================================================================
# Ingress Configuration
# ============================================================================

ingress:
  enabled: true
  className: nginx
  
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  
  hosts:
    - host: api.nidaw.com
      paths:
        - path: /
          pathType: Prefix
          service: backend
          port: 80
    - host: app.nidaw.com
      paths:
        - path: /
          pathType: Prefix
          service: frontend
          port: 80
  tls:
    - secretName: nidaw-tls
      hosts:
        - api.nidaw.com
        - app.nidaw.com

# ============================================================================
# Service Account
# ============================================================================

serviceAccount:
  create: true
  annotations: {}
  name: nidaw-sa

# ============================================================================
# Monitoring
# ============================================================================

monitoring:
  enabled: true
  
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
  
  prometheusRule:
    enabled: false

# ============================================================================
# Pod Disruption Budget
# ============================================================================

podDisruptionBudget:
  enabled: false

# ============================================================================
# Network Policy
# ============================================================================

networkPolicy:
  enabled: false

database:
  host: ""
  port: 5432
  name: nidaw
  username: nidaw_admin
  sslmode: verify-full
  password: ""


migrations:
  enabled: false
  activeDeadlineSeconds: 600
