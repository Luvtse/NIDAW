# Global settings
nameOverride: ""
fullnameOverride: ""

global:
  environment: development
  region: us-east-1
  domain: nidaw.local
  imagePullSecrets: []
  commonLabels: {}
  commonAnnotations: {}

# Backend configuration
backend:
  enabled: true
  replicaCount: 3
  
  image:
    repository: nidaw/backend
    tag: latest
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
    metricsPort: 9090
  
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi
  
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  
  secrets:
    existingSecret: nidaw-backend-secrets
    jwtSecret: ""
    dbPassword: ""
    kafkaBrokers: ""
    redisURL: ""
    stripeApiKey: ""
  env:
    ENVIRONMENT: development
    LOG_LEVEL: info
    LOG_FORMAT: json
    DATABASE_URL: ""
    KAFKA_BROKERS: ""
    REDIS_URL: ""
    STRIPE_KEY: ""
  
  livenessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 10
  
  readinessProbe:
    httpGet:
      path: /ready
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 5

# Frontend configuration
frontend:
  enabled: true
  replicaCount: 2
  tolerations: []
  
  image:
    repository: nidaw/frontend
    tag: latest
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  
  autoscaling:
    enabled: false
  configMap:
    enabled: true
  env:
    API_BASE_URL: http://api.nidaw.local
    WS_BASE_URL: ws://api.nidaw.local/ws
    ENVIRONMENT: development
    ENABLE_DEBUG: "false"
    LOG_LEVEL: info
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /ready
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
  
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

# Ingress configuration
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  
  hosts:
    - host: api.nidaw.local
      paths:
        - path: /
          pathType: Prefix
          service: backend
          port: 80
    - host: app.nidaw.local
      paths:
        - path: /
          pathType: Prefix
          service: frontend
          port: 80
  tls: []

# Database configuration
database:
  host: postgres
  port: 5432
  name: nidaw
  username: nidaw_admin
  sslmode: require
  password: ""

# Kafka configuration
kafka:
  brokers: ""
  topicPrefix: nidaw

# Redis configuration
redis:
  host: ""
  port: 6379
  password: ""

# Monitoring
monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s

serviceAccount:
  create: true
  annotations: {}
  name: ""

nodeSelector: {}
affinity: {}
tolerations: []


migrations:
  enabled: false
  activeDeadlineSeconds: 600
