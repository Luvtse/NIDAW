{{/*
============================================================================
NIDAW Service Account

The workloads consume configured Secrets through Kubernetes secretKeyRef.
Kubelet resolves those references; the application ServiceAccount does not
need API permissions to read Secrets. Keep this ServiceAccount unprivileged.
============================================================================
*/}}

{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nidaw.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nidaw.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
