# ============================================================================
# NIDAW Helm Chart - Staging Values
# ============================================================================

# Global settings
global:
  environment: staging
  region: us-east-1
  domain: staging.nidaw.com
  
  imagePullSecrets: []
  
  commonLabels:
    app.kubernetes.io/part-of: nidaw-platform
    environment: staging
  
  commonAnnotations:
    prometheus.io/scrape: "true"

# ============================================================================
# Backend Configuration
# ============================================================================

backend:
  enabled: true
  
  replicaCount: 1
  
  image:
    repository: nidaw/backend
    tag: staging-latest
    pullPolicy: Always
  
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
    metricsPort: 9090
  
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  
  autoscaling:
    enabled: false
  
  env:
    ENVIRONMENT: staging
    LOG_LEVEL: info
    LOG_FORMAT: json
    ENABLE_PROFILING: "false"
  
  secrets:
    existingSecret: nidaw-backend-secrets
  
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
  
  readinessProbe:
    httpGet:
      path: /ready
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5

# ============================================================================
# Frontend Configuration
# ============================================================================

frontend:
  enabled: true
  
  replicaCount: 1
  
  image:
    repository: nidaw/frontend
    tag: staging-latest
    pullPolicy: Always
  
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  
  autoscaling:
    enabled: false
  
  # Flutter web API URLs are compiled into the image via --dart-define.
  # These values document the expected release contract; changing them in Helm alone is not sufficient.
  env:
    API_BASE_URL: https://api.staging.nidaw.com
    WS_BASE_URL: wss://api.staging.nidaw.com/ws
    ENVIRONMENT: staging
    ENABLE_DEBUG: "false"
    LOG_LEVEL: info
  
  configMap:
    enabled: true
  
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
  
  readinessProbe:
    httpGet:
      path: /ready
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5

# ============================================================================
# Ingress Configuration
# ============================================================================

ingress:
  enabled: true
  className: nginx
  
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  
  hosts:
    - host: api.staging.nidaw.com
      paths:
        - path: /
          pathType: Prefix
          service: backend
          port: 80
    - host: app.staging.nidaw.com
      paths:
        - path: /
          pathType: Prefix
          service: frontend
          port: 80
  tls: []

# ============================================================================
# Service Account
# ============================================================================

serviceAccount:
  create: true
  annotations: {}
  name: nidaw-sa

# ============================================================================
# Monitoring
# ============================================================================

monitoring:
  enabled: true
  
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
  
  prometheusRule:
    enabled: false

# ============================================================================
# Pod Disruption Budget
# ============================================================================

podDisruptionBudget:
  enabled: false

# ============================================================================
# Network Policy
# ============================================================================

networkPolicy:
  enabled: false

database:
  host: ""
  port: 5432
  name: nidaw
  username: nidaw_admin
  sslmode: require
  password: ""


migrations:
  enabled: true
  activeDeadlineSeconds: 600
