server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location = /ready {
        access_log off;
        default_type text/plain;
        return 200 'ready';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
