name: nidaw_driver_app
description: NIDAW Driver App - Drive and earn with NIDAW
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Navigation
  go_router: ^13.0.0

  # Dependency Injection
  get_it: ^7.6.4

  # Networking
  dio: ^5.4.0
  pretty_dio_logger: ^1.3.1
  web_socket_channel: ^2.4.0

  # Location & Maps
  # Phase 6 dependency audit: geocoding/location removed (zero importers;
  # geocoding is served via the backend + local cache path).
  google_maps_flutter: ^2.5.3
  geolocator: ^10.1.0

  # Background Services
  # Phase 6 audit: workmanager/flutter_local_notifications/flutter_map removed
  # (zero importers). flutter_background_service RETAINED — referenced
  # dynamically by the AndroidManifest foreground location service.
  flutter_background_service: ^5.0.5

  # Notifications
  firebase_core: ^2.24.2

  # UI Components
  fl_chart: ^0.65.0

  # Utilities
  intl: ^0.18.1
  url_launcher: ^6.2.2

  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Image handling
  image_picker: ^1.0.4

  # Maps & Navigation (google_maps_flutter already declared above;
  # flutter_polyline_points supplements route polylines)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.6
  hive_generator: ^2.0.1
  bloc_test: ^9.1.5
  mockito: ^5.4.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700